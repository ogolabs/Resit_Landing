<svg width="460" height="90" viewBox="0 0 460 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .brand-title { fill: #0F172A; }
    .brand-subtitle { fill: #64748B; }
    @media (prefers-color-scheme: dark) {
      .brand-title { fill: #F8FAFC; }
      .brand-subtitle { fill: #94A3B8; }
    }
  </style>

  <defs>
    <!-- Mask for clean transparent negative-space gap at ribbon crossover -->
    <mask id="full-ribbon-gap">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <path d="M108 104 L148 152" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Left: Transparent Infinite Ledger Icon Mark (68px height) -->
  <g transform="translate(6, 11) scale(0.265)">
    <!-- Right Loop: Receipt Emerald -->
    <path d="M128 128 C148 154 168 174 198 174 C228 174 244 154 244 128 C244 102 228 82 198 82 C168 82 148 102 128 128" 
          stroke="#10B981" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
          mask="url(#full-ribbon-gap)"/>

    <!-- Left Loop & Over-pass: Electric Blue -->
    <path d="M128 128 C108 102 88 82 58 82 C28 82 12 102 12 128 C12 154 28 174 58 174 C88 174 108 154 128 128 L144 148" 
          stroke="#2563EB" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Twin Precision Nodes -->
    <circle cx="58" cy="128" r="8" fill="#2563EB"/>
    <circle cx="198" cy="128" r="8" fill="#10B981"/>
  </g>

  <!-- Right: Typography Wordmark & Complete Tagline -->
  <text x="88" y="48" font-family="Sora, system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8" class="brand-title">Resit</text>
  <text x="89" y="70" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" class="brand-subtitle">SMART QR RECEIPTS · SALES BOOK · SHIPMENTS</text>
</svg>
